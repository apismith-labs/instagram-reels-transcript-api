name: Offline integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    env:
      APIFY_TOKEN: ''
      INSTAGRAM_SESSIONID: ''
      APIFY_REQUIRE_MAX_TOTAL_CHARGE_USD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the declared Python example dependency
        run: python -m pip install --disable-pip-version-check -r examples/python/requirements.txt
      - name: Confirm no dotenv file is present in the checkout
        run: python -c "from pathlib import Path; assert not Path('.env').exists(), 'CI must not use a local .env file'"
      - name: Run offline Python tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile Python examples and tests
        run: python -m compileall -q examples/python tests/python scripts

  node-offline:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '18'
          - os: ubuntu-latest
            node-version: '20'
          - os: ubuntu-latest
            node-version: '22'
          - os: windows-latest
            node-version: '20'
          - os: macos-latest
            node-version: '20'
    env:
      APIFY_TOKEN: ''
      INSTAGRAM_SESSIONID: ''
    defaults:
      run:
        working-directory: examples/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: examples/nodejs/package-lock.json
      - name: Confirm no dotenv file is present in the checkout
        run: node -e "const fs = require('node:fs'); if (fs.existsSync('../../.env')) throw new Error('CI must not use a local .env file')"
      - name: Install locked Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Check ESM syntax
        run: node -e "const {spawnSync}=require('node:child_process'); for (const file of ['reliable-actor.mjs','single-url.mjs','native-bulk.mjs','batch-csv.mjs']) { const result=spawnSync(process.execPath,['--check',file],{stdio:'inherit'}); if (result.status !== 0) process.exit(result.status || 1); }"
      - name: Run offline Node.js tests
        working-directory: ${{ github.workspace }}
        run: node scripts/run_node_ci_tests.mjs
