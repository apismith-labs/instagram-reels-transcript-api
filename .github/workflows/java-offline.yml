name: Java offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  java-offline:
    name: Java 17 / Ubuntu
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ''
      INSTAGRAM_SESSIONID: ''
      APIFY_MAX_TOTAL_CHARGE_USD: ''
      APIFY_REQUIRE_MAX_TOTAL_CHARGE_USD: ''
    defaults:
      run:
        working-directory: examples/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Confirm checkout has no local dotenv file
        run: test ! -e ../../.env
      - name: Compile
        run: mvn -B -q -DskipTests compile
      - name: Test offline gate self-test
        run: python3 scripts/run_offline_tests.py --self-test
      - name: Run offline Java tests with count gate
        run: python3 scripts/run_offline_tests.py
      - name: Package (thin + shaded)
        run: mvn -B -q -DskipTests package
      - name: Verify external Java consumer
        shell: bash
        run: |
          set -eu
          shaded_jar="$GITHUB_WORKSPACE/examples/java/target/instagram-reels-transcript-api-java-examples-0.1.0-shaded.jar"
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          mkdir -p "$consumer_dir/classes"
          javac -cp "$shaded_jar" -d "$consumer_dir/classes" \
            "$GITHUB_WORKSPACE/examples/java/ci-consumer/ExternalConsumer.java"
          java -cp "$shaded_jar:$consumer_dir/classes" ExternalConsumer
      - name: Verify regression mutation detection
        run: python3 scripts/mutation_check.py
