name: Python offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    env:
      APIFY_TOKEN: ''
      INSTAGRAM_SESSIONID: ''
      APIFY_REQUIRE_MAX_TOTAL_CHARGE_USD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the declared Python example dependency
        run: python -m pip install --disable-pip-version-check -r examples/python/requirements.txt
      - name: Confirm no dotenv file is present in the checkout
        run: python -c "from pathlib import Path; assert not Path('.env').exists(), 'CI must not use a local .env file'"
      - name: Run offline Python tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile Python examples and tests
        run: python -m compileall -q examples/python tests/python scripts
