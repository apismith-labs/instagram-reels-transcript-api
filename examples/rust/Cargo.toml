[package]
name = "instagram-transcripts-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "instagram_transcripts"
path = "src/lib.rs"

[[bin]]
name = "instagram-transcripts"
path = "src/bin/instagram_transcripts.rs"

[[bin]]
name = "batch_csv"
path = "src/bin/batch_csv.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.13"
